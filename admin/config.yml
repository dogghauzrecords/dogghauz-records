backend:
  name: git-gateway
  branch: main

# painel em português
locale: "pt"

media_folder: "assets/dogghauz/blog"
public_folder: "/assets/dogghauz/blog"

collections:
  - name: "posts"
    label: "Anti Mag"
    files:
      - file: "blog/posts.json"
        label: "Matérias do Anti Mag"
        name: "posts"
        fields:
          - label: "Matérias"
            name: "posts"
            widget: "list"
            summary: "{{title}} — {{date}}"
            fields:
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Slug (URL, sem espaços/acentos)", name: "slug", widget: "string", hint: "ex: nova-parceria-defected" }
              - { label: "Data", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
              - { label: "Autor", name: "author", widget: "string", default: "DoggHaüz Records" }
              - { label: "Capa", name: "cover", widget: "image", required: false }
              - { label: "Resumo (aparece no card)", name: "excerpt", widget: "text" }
              - { label: "Conteúdo", name: "body", widget: "markdown" }
              - { label: "Publicada", name: "published", widget: "boolean", default: true }
