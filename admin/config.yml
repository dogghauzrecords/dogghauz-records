backend:
  name: git-gateway
  branch: main

# painel em português
locale: "pt"

media_folder: "assets/dogghauz/blog"
public_folder: "/assets/dogghauz/blog"

collections:
  - name: "posts"
    label: "DGGZ MAG"
    files:
      - file: "blog/posts.json"
        label: "Matérias do DGGZ MAG"
        name: "posts"
        fields:
          - label: "Matérias"
            name: "posts"
            widget: "list"
            summary: "{{title}} — {{date}}"
            fields:
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Slug (URL, sem espaços/acentos)", name: "slug", widget: "string", hint: "ex: nova-parceria-defected" }
              - { label: "Data", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
              - { label: "Autor", name: "author", widget: "string", default: "DoggHaüz Records" }
              - { label: "Capa", name: "cover", widget: "image", required: false }
              - { label: "Resumo (aparece no card)", name: "excerpt", widget: "text" }
              - { label: "Conteúdo", name: "body", widget: "markdown" }
              - { label: "Título (English)", name: "title_en", widget: "string", required: false }
              - { label: "Resumo (English)", name: "excerpt_en", widget: "text", required: false }
              - { label: "Conteúdo (English)", name: "body_en", widget: "markdown", required: false }
              - { label: "Título (Español)", name: "title_es", widget: "string", required: false }
              - { label: "Resumo (Español)", name: "excerpt_es", widget: "text", required: false }
              - { label: "Conteúdo (Español)", name: "body_es", widget: "markdown", required: false }
              - { label: "Publicada", name: "published", widget: "boolean", default: true }
